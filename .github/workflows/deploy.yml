name: Deploy Supabase Functions

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: |
          supabase functions deploy pages_system --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy stuCHECK_LOGIN --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy stuCOMPLETE_PROFILE --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy stuLOGIN --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy stuOTP_REQUEST --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy stuREADY --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
