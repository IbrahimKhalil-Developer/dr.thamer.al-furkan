<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>لوحة تحكم — مشروع التحفيظ المُتقِن</title>
<link rel="icon" href="./icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css?v=20260627a">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-mark"><img src="./icon.png" alt="" onerror="this.style.display='none'"></div>
  <div class="spinner lg"></div>
</div>

<div id="login" class="login hidden">
  <div class="login-card">
    <div class="login-logo"><img src="./icon.png" alt="" onerror="this.style.display='none'"></div>
    <h1>مشروع التحفيظ المُتقِن</h1>
    <p class="muted">لوحة الإدارة — تسجيل الدخول</p>
    <div class="field"><label>البريد الإلكتروني</label>
      <input id="lg-email" type="email" dir="ltr" autocomplete="username" placeholder="admin@example.com"></div>
    <div class="field"><label>كلمة المرور</label>
      <input id="lg-pass" type="password" dir="ltr" autocomplete="current-password" placeholder="••••••••"></div>
    <button id="lg-btn" class="btn btn-primary btn-block btn-lg">دخول</button>
    <p id="lg-err" class="err-text hidden"></p>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo"><img src="./icon.png" alt="" onerror="this.parentElement.classList.add('noimg')"></div>
      <div class="logo-text"><strong>التحفيظ المُتقِن</strong><span>لوحة الإدارة</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <button id="btn-refresh" class="btn btn-ghost btn-block" data-ic="refresh">تحديث البيانات</button>
      <button id="btn-logout" class="btn btn-ghost btn-block" data-ic="logout">تسجيل الخروج</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button id="menu-toggle" class="icon-btn only-mobile" data-ic="menu"></button>
      <div class="brand-center">
        <span class="brand-name">مشروع التحفيظ المُتقِن</span>
        <span id="admin-line" class="admin-line"></span>
      </div>
      <div id="page-title" class="page-title-pill"></div>
    </header>
    <main id="view" class="view"></main>
  </div>
  <div id="scrim" class="scrim"></div>
</div>

<div id="modal-root"></div>
<div id="viewer-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="./js/icons.js"></script>
<script src="./js/api.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/app.js?v=20260627a"></script>
</body>
</html>
